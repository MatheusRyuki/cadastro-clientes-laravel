services:
    laravel.e2e:
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${E2E_APP_PORT:-8081}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            APP_ENV: e2e
            APP_DEBUG: 'false'
            APP_URL: http://127.0.0.1:${E2E_APP_PORT:-8081}
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: '3306'
            DB_DATABASE: e2e
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            SESSION_DRIVER: database
            SESSION_COOKIE: e2e-session
            CACHE_STORE: database
            QUEUE_CONNECTION: sync
            FILESYSTEM_DISK: public
            FILESYSTEM_PUBLIC_ROOT: /var/www/html/storage/app/e2e-public
            FILESYSTEM_PUBLIC_PATH: /e2e-storage
        env_file:
            - .env.e2e
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
